server.port=8081

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/tasktracker
spring.datasource.username=tasktracker
spring.datasource.password=tasktracker
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=jdbc:postgresql://127.0.0.1:5433/tasktracker
spring.flyway.user=tasktracker
spring.flyway.password=tasktracker

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration