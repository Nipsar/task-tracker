<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker — Задачи</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-bg"></div>
<div class="page">
    <div class="container">
        <nav id="appNav" class="app-nav"></nav>

        <header class="hero">
            <div>
                <div class="eyebrow">Task Tracker</div>
                <h1>Задачи</h1>
                <p class="subtitle">Создание, фильтрация, смена статуса и удаление задач</p>
            </div>
            <div class="hero-actions">
                <button id="loadBtn" class="primary-btn">Обновить задачи</button>
            </div>
        </header>

        <section class="panel create-task-panel page-section">
            <div class="panel-head create-task-head">
                <div>
                    <h2>Добавить задачу</h2>
                    <p>Форма отправляет POST /api/tasks</p>
                </div>
            </div>

            <form id="createTaskForm" class="create-task-form">
                <label class="form-field form-field-wide">
                    <span>Проект</span>
                    <select id="projectSelectInput" name="projectId" class="filter-select" required>
                        <option value="">Загрузка проектов...</option>
                    </select>
                </label>

                <label class="form-field form-field-wide">
                    <span>Название</span>
                    <input id="titleInput" name="title" type="text" class="filter-input" placeholder="Например: Сделать REST API" required>
                </label>

                <label class="form-field">
                    <span>Статус</span>
                    <select id="createStatusInput" name="status" class="filter-select" required>
                        <option value="NEW">NEW</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="DONE">DONE</option>
                    </select>
                </label>

                <label class="form-field">
                    <span>Deadline</span>
                    <input id="deadlineInput" name="deadline" type="datetime-local" class="filter-input">
                </label>

                <div class="form-actions">
                    <button id="createTaskBtn" type="submit" class="primary-btn">Добавить задачу</button>
                    <button id="clearTaskFormBtn" type="button" class="secondary-btn">Очистить</button>
                </div>
            </form>

            <div id="createTaskMessage" class="form-message" aria-live="polite"></div>
        </section>

        <section class="panel tasks-panel">
            <div class="panel-head tasks-head">
                <div>
                    <h2>Список задач</h2>
                    <p id="statusMessage">Загрузка задач...</p>
                </div>
                <div class="filters">
                    <input id="searchInput" type="text" class="filter-input" placeholder="Поиск по названию">
                    <select id="statusFilter" class="filter-select">
                        <option value="ALL">Все активные</option>
                        <option value="NEW">NEW</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>
            </div>
            <div id="taskList" class="task-grid"></div>
        </section>
    </div>
</div>

<script type="module" src="/js/pages/tasks-page.js"></script>
</body>
</html>
